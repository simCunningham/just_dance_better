<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose debug</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #stage { position: relative; max-width: 100vw; }
  video, canvas { display: block; width: 100%; }
  canvas { position: absolute; inset: 0; height: 100%; pointer-events: none; }
  #info { color: #aaa; }
</style>
</head>
<body>
<header>
  <strong id="title">Loading</strong>
  <span id="info"></span>
</header>
<div id="stage">
  <video id="video" controls playsinline></video>
  <canvas id="canvas"></canvas>
</div>
<script>
const id = location.pathname.split("/").pop();
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[28,30],[30,32],[15,17],[15,19],[15,21],[16,18],[16,20],[16,22],[0,7],[0,8]];
const COLORS = ["#ff5a5a", "#ffb03a", "#ffe14a", "#5be37d", "#3ad8ff", "#5a8cff", "#b46bff", "#ff6bd5", "#ffffff"];
let data, times;

function frameAt(t) {
  let lo = 0, hi = times.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (times[mid] <= t) lo = mid; else hi = mid - 1;
  }
  return data.frames[lo];
}

function draw() {
  requestAnimationFrame(draw);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.clearRect(0, 0, w, h);
  if (!data) return;
  const frame = frameAt(video.currentTime);
  let shown = 0;
  frame.d.forEach((p, d) => {
    if (!p) return;
    shown++;
    const pts = p;
    const xy = i => [pts[i][0] * w, pts[i][1] * h];
    const color = COLORS[d % COLORS.length];
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    for (const [a, b] of BONES) {
      ctx.globalAlpha = pts[a][2] < data.min_visibility || pts[b][2] < data.min_visibility ? 0.3 : 1;
      ctx.beginPath(); ctx.moveTo(...xy(a)); ctx.lineTo(...xy(b)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const [x, y] = xy(0);
    ctx.font = "bold 18px system-ui";
    ctx.fillStyle = "#000";
    ctx.fillText(d + 1, x - 4, y - 18);
    ctx.fillStyle = color;
    ctx.fillText(d + 1, x - 5, y - 19);
  });
  info.textContent = `t=${video.currentTime.toFixed(2)}s  dancers tracked: ${shown}/${data.dancers}`;
}

async function load() {
  const song = await fetch(`/songs/${id}`).then(r => r.json());
  document.getElementById("title").textContent = song.title;
  video.src = `/songs/${id}/video`;
  const res = await fetch(`/songs/${id}/choreography`);
  if (!res.ok) { info.textContent = `No choreography yet (status: ${song.status})`; return; }
  data = await res.json();
  times = data.frames.map(f => f.t);
}

load();
draw();
</script>
</body>
</html>
